# Temporary public testing only. Data is erased on restarts/redeploys.
services:
  - type: web
    name: filego
    runtime: python
    plan: free
    buildCommand: npm ci && node ./node_modules/vite/bin/vite.js build && pip install -r backend/requirements.txt
    startCommand: python backend/run.py
    healthCheckPath: /api/ping
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/filego.db
      - key: STORAGE_DIR
        value: /tmp/filego-storage
      - key: LOG_TO_FILE
        value: "false"
      - key: REGISTRATION_MODE
        value: open
